<svg width="2400" height="960" viewBox="0 0 2400 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Workplace Floor Plate - Level 5</title>
  <desc id="desc">Rendered plan showing the north and south desk wings, central core with elevators, and perimeter focus rooms based on the provided blueprint.</desc>
  <defs>
